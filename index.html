<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16303a">
<title>Melbourne Summer Road Trip · 墨尔本夏日自驾游</title>
<style>
:root{--bg:#f4f2ee;--sf:#fff;--tx:#1f2328;--mu:#5b6470;--ac:#0b6e75;--bd:#dcd8d0}
@media(prefers-color-scheme:dark){:root{--bg:#14171b;--sf:#1d2227;--tx:#e8eaed;--mu:#a6adb7;--ac:#5fc7cf;--bd:#303740}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;align-items:center;justify-content:center;padding:calc(1rem + env(safe-area-inset-top)) 1rem calc(1rem + env(safe-area-inset-bottom))}
main{width:100%;max-width:440px;text-align:center}
.emoji{font-size:3rem;line-height:1}
h1{margin:.6rem 0 .2rem;font-size:1.6rem;line-height:1.25}
.sub{margin:0 0 1.6rem;color:var(--mu);font-size:.95rem}
.choose{margin:0 0 .8rem;font-weight:600}
a.lang{display:block;text-decoration:none;color:var(--tx);background:var(--sf);border:2px solid var(--bd);border-radius:16px;padding:1.1rem 1rem;margin-bottom:.8rem;min-height:72px;transition:border-color .15s}
a.lang:hover,a.lang:focus-visible,a.lang.rec{border-color:var(--ac)}
a.lang b{display:block;font-size:1.25rem;color:var(--ac)}
a.lang span{display:block;color:var(--mu);font-size:.9rem;margin-top:.15rem}
.ft{margin-top:1.2rem;color:var(--mu);font-size:.8rem}
</style>
</head>
<body>
<main>
  <div class="emoji">🚗</div>
  <h1>Melbourne Summer Road Trip<br>墨尔本夏日自驾游</h1>
  <p class="sub">28 Dec 2026 – 2 Jan 2027 · 2026年12月28日 – 2027年1月2日</p>
  <p class="choose">Choose your language · 请选择语言</p>
  <a class="lang" id="zh" href="Melbourne_CN.html"><b>中文</b><span>查看中文版行程</span></a>
  <a class="lang" id="en" href="Melbourne_EN.html"><b>English</b><span>View the English itinerary</span></a>
  <div class="ft">Melbourne · Great Ocean Road · Phillip Island</div>
</main>
<script>
// Highlight the language that matches the browser setting (no automatic redirect).
(function(){
  var l=(navigator.language||"").toLowerCase();
  var el=document.getElementById(l.indexOf("zh")===0?"zh":"en");
  if(el)el.classList.add("rec");
})();
</script>
</body>
</html>
